services:
  api:
    build: .
    ports:
      - "9569:9569"
    env_file:
      - .env
    environment:
      ZKSATO_DATABASE_URL: "postgresql+psycopg://zksato:${POSTGRES_PASSWORD:-zksato_dev_only}@postgres:5432/zksato"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zksato
      POSTGRES_USER: zksato
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zksato_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zksato -d zksato"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
