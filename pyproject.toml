[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zksato"
version = "1.0.0"
description = "Risk-first automated trading platform and dashboard for SET / TFEX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "prometheus-client>=0.22,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "redis>=5.2,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.160,<7.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
  "ruff>=0.11,<1.0",
]
quality = [
  "build>=1.5,<2.0",
  "hadolint-coatl==2.14.0",
  "mypy>=2.3,<3.0",
  "pip-licenses>=5.5.5,<6.0",
  "twine>=6.2,<7.0",
  "yamllint>=1.38,<2.0",
  "zizmor==1.29.0",
]
security = [
  "bandit>=1.8,<2.0",
  "pip-audit>=2.8,<3.0",
]
settrade = [
  "settrade-v2==2.2.1",
]
ccxt = [
  "ccxt>=4.3,<5.0",
]
prediction = [
  "xgboost>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
]
observability = [
  "opentelemetry-api>=1.35,<2.0",
  "opentelemetry-sdk>=1.35,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zksato"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "performance: load/performance tests excluded from normal CI",
  "uat: requires broker-provided UAT credentials",
]

[tool.coverage.run]
branch = true
source = ["zksato"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
files = ["src/zksato", "scripts"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
