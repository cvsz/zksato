[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zksato-workspace"
version = "2.0.0-dev"
description = "zksato modular monorepo workspace"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/zksato"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.160,<7.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=7.1,<8.0",
    "ruff==0.16.6",
]
quality = [
    "build>=1.5,<2.0",
    "hadolint-coatl==2.15.1",
    "mypy>=2.4,<3.0",
    "pip-licenses>=5.5,<6.0",
    "twine>=6.2,<8.0",
    "yamllint>=1.38,<2.0",
    "zizmor>=1.30,<2.0",
]
security = [
    "bandit>=1.8,<2.0",
    "pip-audit>=2.8,<3.0",
]
settrade = [
    "settrade-v2==2.2.1",
]
ccxt = [
    "ccxt>=4.3,<5.0",
]
prediction = [
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.0,<4.0",
]
observability = [
    "opentelemetry-api>=1.35,<2.0",
    "opentelemetry-sdk>=1.35,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.35,<2.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]

[tool.uv.sources]
zksato-core = { workspace = true }
zksato-risk = { workspace = true }
zksato-market = { workspace = true }
zksato-broker = { workspace = true }
zksato-strategy = { workspace = true }
zksato-portfolio = { workspace = true }
zksato-automation = { workspace = true }
zksato-api = { workspace = true }
zksato-cli = { workspace = true }
zksato-test-utils = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Enforcement policy (PR: Phase 4 + build repair):
# - E/F/W/I/UP/B/SIM/PTH/PERF/RUF/NPY/TID are enforced and kept green.
# - ANN/ARG/ERA/PL/TRY were aspirational families with 1400+ pre-existing
#   violations in legacy modules; re-adopting them is a separate, dedicated
#   hardening effort (tracked in docs/ROADMAP.md) rather than a silent gate.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "PERF", "RUF", "NPY", "TID"]
ignore = [
    "E501",     # long lines in generated/legacy tables; formatter keeps 100 on new code
    "PTH118",   # os.path usage is accepted in legacy modules
    "PLW0603",  # module-level globals are intentional in dashboards/daemons
    "TID252",   # relative imports inside packages are the repo convention
    "NPY002",   # legacy numpy.random usage in research scripts
    "UP042",    # str,Enum -> StrEnum changes str() output ("Side.BUY" -> "buy"); deferred to a dedicated migration
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B007", "B008", "RUF043", "SIM117"]
"packages/*/tests/**" = ["B007", "B008", "RUF043", "SIM117"]
"packages/zksato-cli/src/zksato_cli/commands/**" = ["B008"]  # typer.Option()/typer.Argument() in defaults is the required typer pattern

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["."]
testpaths = ["tests", "packages/*/tests", "apps/*/tests"]
asyncio_mode = "auto"
markers = [
    "performance: load/performance tests excluded from normal CI",
    "uat: requires broker-provided UAT credentials",
    "integration: requires external services",
    "eval: evaluation/benchmark tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["packages", "apps"]
parallel = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true