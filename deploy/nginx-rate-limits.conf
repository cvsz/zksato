# Rate-limiting zones for zksato.zeaz.dev
# Install to: /etc/nginx/conf.d/rate-limits.conf
#
#   sudo cp deploy/nginx-rate-limits.conf /etc/nginx/conf.d/rate-limits.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# These are referenced by deploy/nginx.zksato.conf.

limit_req_zone $binary_remote_addr zone=api_zksato:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_zksato:10m rate=5r/s;
