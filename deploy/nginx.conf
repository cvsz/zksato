events {
    worker_connections 1024;
}

http {
    upstream backend_api {
        server api:9569;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    upstream dashboard_app {
        server dashboard:80;
    }

    server {
        listen 80;
        server_name zksato.zeaz.dev localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name zksato.zeaz.dev;

        ssl_certificate /etc/letsencrypt/live/zksato.zeaz.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zksato.zeaz.dev/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Frontend Operator Application
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Backend FastAPI Routes
        location ~ ^/(v1|health|livez|readyz|metrics|docs|openapi.json) {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vite Dashboard
        location /dash {
            proxy_pass http://dashboard_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

