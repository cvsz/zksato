services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "9569"
    env_file:
      - ../.env
    environment:
      ZKSATO_ENVIRONMENT: production
      ZKSATO_AUTH_REQUIRED: "true"
      ZKSATO_LIVE_TRADING_ENABLED: "false"
      ZKSATO_LOG_JSON: "true"
      ZKSATO_METRICS_ENABLED: "true"
      ZKSATO_RECONCILIATION_ENABLED: "true"
      ZKSATO_ALLOWED_ORIGINS: "https://zksato.zeaz.dev,https://zksato-api.zeaz.dev,https://zksato-dash.zeaz.dev"
      ZKSATO_ALLOWED_HOSTS: "zksato.zeaz.dev,zksato-api.zeaz.dev,zksato-dash.zeaz.dev,localhost,127.0.0.1,api"
    secrets:
      - postgres_password
      - redis_password
      - session_secret
      - api_keys
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: "https://zksato.zeaz.dev"
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  dashboard:
    build:
      context: ../dashboard
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zksato
      POSTGRES_USER: zksato
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zksato -d zksato"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backup:
    image: python:3.14-slim
    command: >
      sh -c "apt-get update && apt-get install -y postgresql-client &&
             while true; do
               ts=$$(date +%Y%m%d_%H%M%S);
               PGPASSWORD=$$(cat /run/secrets/postgres_password) pg_dump -h postgres -U zksato -d zksato -Fc > /backups/zksato_$$ts.dump &&
               gzip /backups/zksato_$$ts.dump &&
               find /backups -name 'zksato_*.dump.gz' -mtime +7 -delete;
               sleep 86400;
             done"
    volumes:
      - ./backups:/backups
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
      - dashboard
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  session_secret:
    file: ./secrets/session_secret.txt
  api_keys:
    file: ./secrets/api_keys.txt

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  certbot_www:
