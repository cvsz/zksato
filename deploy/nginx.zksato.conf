# NGINX reverse proxy for zksato.zeaz.dev
#
# This configuration is for the HOST-level nginx instance (not Docker).
# It listens on 127.0.0.1:8089 — the loopback port exposed to the
# Cloudflare Tunnel (zwslcore). TLS termination is handled by Cloudflare.
#
# Architecture:
#   Cloudflare Edge (TLS) → cloudflared tunnel → nginx :8089 → services
#
# Install:
#   sudo cp deploy/nginx.zksato.conf /etc/nginx/sites-available/zksato
#   sudo ln -sf /etc/nginx/sites-available/zksato /etc/nginx/sites-enabled/zksato
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires nginx installed on the host:
#   sudo apt-get install -y nginx
#
# Rate-limit zones are defined in /etc/nginx/conf.d/rate-limits.conf.
# See deploy/nginx-rate-limits.conf for the snippet to install there.

server {
    listen 127.0.0.1:8089;
    server_name zksato.zeaz.dev localhost;

    # Security headers (Cloudflare handles TLS; these protect the app layer)
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Trust Cloudflare forwarded headers
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    client_max_body_size 50M;

    # ── Auth endpoints — stricter rate limit ──────────────────────────────
    location ~ ^/v1/auth/ {
        limit_req zone=auth_zksato burst=5 nodelay;
        proxy_pass         http://127.0.0.1:9569;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── API & engine routes ───────────────────────────────────────────────
    location ~ ^/(v1|health|livez|readyz|metrics|openapi\.json|docs) {
        limit_req zone=api_zksato burst=20 nodelay;
        proxy_pass         http://127.0.0.1:9569;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Vite lite dashboard ───────────────────────────────────────────────
    # NOTE: dashboard/vite.config.ts must set base: '/dash/' so that
    # built asset paths are prefixed correctly. The trailing slash on
    # proxy_pass rewrites /dash/* → /* at the upstream.
    location /dash/ {
        proxy_pass         http://127.0.0.1:5174/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # ── Next.js frontend (catch-all) ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
