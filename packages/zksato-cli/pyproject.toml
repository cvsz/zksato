[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zksato-cli"
version = "2.0.0-dev"
description = "zksato CLI commands and utilities"
requires-python = ">=3.11"
dependencies = [
    "zksato-core",
    "zksato-api",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "pyyaml>=6.0,<7.0",
    "textual>=0.80,<2.0",
]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
zksato = "zksato_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "hypothesis>=6.160,<7.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zksato_cli"]