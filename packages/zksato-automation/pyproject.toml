[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zksato-automation"
version = "2.0.0-dev"
description = "zksato trading automation, scheduler, and agent OS"
requires-python = ">=3.11"
dependencies = [
    "zksato-core",
    "zksato-risk",
    "zksato-strategy",
    "zksato-broker",
    "zksato-portfolio",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "apscheduler>=3.10,<4.0",
    "pyyaml>=6.0,<7.0",
]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "hypothesis>=6.160,<7.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zksato_automation"]