[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zksato-portfolio"
version = "2.0.0-dev"
description = "zksato portfolio management, reconciliation, and persistence"
requires-python = ">=3.11"
dependencies = [
    "zksato-core",
    "zksato-risk",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "redis>=5.0,<6.0",
    "psycopg>=3.1,<4.0",
]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "hypothesis>=6.160,<7.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zksato_portfolio"]