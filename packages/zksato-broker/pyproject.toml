[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zksato-broker"
version = "2.0.0-dev"
description = "zksato broker adapters and routing"
requires-python = ">=3.11"
dependencies = [
    "zksato-core",
    "zksato-market",
    "zksato-risk",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "hypothesis>=6.160,<7.0",
    "ruff==0.16.6",
]
settrade = [
    "settrade-v2==2.2.1",
]
ccxt = [
    "ccxt>=4.3,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zksato_broker"]