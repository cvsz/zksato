[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zksato-test-utils"
version = "2.0.0-dev"
description = "zksato test utilities, fixtures, and generators"
requires-python = ">=3.11"
dependencies = [
    "zksato-core",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "hypothesis>=6.160,<7.0",
    "faker>=30.0,<31.0",
]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zksato_test_utils"]