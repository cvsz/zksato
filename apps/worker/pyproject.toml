[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zksato-worker-app"
version = "2.0.0-dev"
description = "zksato background worker application"
requires-python = ">=3.11"
dependencies = [
    "zksato-automation",
    "zksato-broker",
    "zksato-portfolio",
]
readme = "../../README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]