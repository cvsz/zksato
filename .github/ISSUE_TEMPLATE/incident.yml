name: Incident report
description: Track an operational or trading incident
title: "incident: "
labels: ["incident"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [SEV-1, SEV-2, SEV-3, SEV-4]
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
    validations:
      required: true
  - type: textarea
    id: timeline
    attributes:
      label: Timeline (timezone included)
  - type: textarea
    id: containment
    attributes:
      label: Containment / kill-switch actions
  - type: textarea
    id: followup
    attributes:
      label: Follow-up actions
