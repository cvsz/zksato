name: Resilience

on:
  pull_request:
    paths:
      - src/zksato/risk.py
      - src/zksato/reconcile.py
      - src/zksato/persistence.py
      - src/zksato/coordination.py
      - src/zksato/approvals.py
      - tests/**
      - .github/workflows/resilience.yml
  merge_group:
  schedule:
    - cron: "53 20 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  deterministic-failure-paths:
    name: Recovery and fail-closed / hash seed ${{ matrix.hash-seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hash-seed: ["1", "987654321"]
    env:
      PYTHONHASHSEED: ${{ matrix.hash-seed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run deterministic safety and recovery suite
        run: |
          pytest -q \
            tests/test_risk_properties.py \
            tests/test_reconciliation_gate.py \
            tests/test_paper_recovery.py \
            tests/test_audit_integrity.py \
            tests/test_approvals.py \
            tests/test_auth.py
