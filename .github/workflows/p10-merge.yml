name: P10 Merge

on:
  push:
    branches:
      - agent/p10-durable-operations-reliability

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: p10-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[p10-final-head]') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "12"
    steps:
      - name: Verify P10 payload, remove temporary workflows, and wait for final checks
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" repo -- --branch "$GITHUB_REF_NAME" --single-branch
          cd repo

          test -f migrations/0003_outbox_delivery.sql
          test -f src/zksato/outbox_delivery.py
          grep -q 'notification_retry_base_seconds' src/zksato/config.py
          grep -q 'mark_outbox_failed' src/zksato/store.py
          grep -q 'strategy version.*immutable' src/zksato/store.py
          grep -q 'attempt_count' src/zksato/persistence.py
          grep -q 'notification.dead_lettered' src/zksato/notifications.py
          test -f tests/test_outbox_delivery.py
          test -f tests/test_strategy_version_immutability.py

          rm -f \
            .github/workflows/p10-apply.yml \
            .github/workflows/p10-format.yml \
            .github/workflows/p10-gate.yml \
            .github/workflows/p10-merge.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: finalize P10 branch [p10-final-head]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

          cd ..
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash \
            --subject "feat: harden durable outbox and strategy version integrity" \
            --body "Add bounded durable webhook retry/dead-letter state and immutable strategy version identity while preserving all live-trading safety boundaries."
