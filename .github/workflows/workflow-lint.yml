name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - .github/labeler.yml
      - .yamllint.yml
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - .github/labeler.yml
      - .yamllint.yml
      - pyproject.toml
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: YAML, actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install workflow audit tools
        run: python -m pip install 'yamllint>=1.38,<2.0' 'zizmor==1.29.0'
      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          install -m 0755 "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/actionlint-bin"
      - name: Validate YAML
        run: yamllint .github .yamllint.yml docker-compose.yml
      - name: Validate workflow semantics
        run: "$RUNNER_TEMP/actionlint-bin" -color
      - name: Audit workflow security
        run: zizmor --min-severity high --min-confidence high .github/workflows
