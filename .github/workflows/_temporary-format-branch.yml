name: Temporary Branch Formatter

on:
  push:
    branches:
      - agent/full-repository-completion-vnext

permissions:
  contents: write

concurrency:
  group: temporary-format-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/full-repository-completion-vnext
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.2'
      - name: Format repository
        run: ruff format .
      - name: Commit formatting if needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Repository already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'style: apply ruff formatting'
          git push origin HEAD:agent/full-repository-completion-vnext
