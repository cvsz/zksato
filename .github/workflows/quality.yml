name: Quality

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Format, types, workflows, contract, package and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/update-all-2026-08-31
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,quality]'
      - name: Apply verified repair
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/update-all-2026-08-31'
        run: |
          set -euo pipefail
          python .github/repair_update_all.py
          ruff check --fix src/zksato/tradingview.py src/zksato/secrets.py src/zksato/prediction/live.py src/zksato/broker/ccxt.py src/zksato/broker/prediction.py src/zksato/prediction/broker.py src/zksato/agent_os/engine.py src/zksato/api.py tests/test_prediction.py
          ruff format src/zksato/tradingview.py src/zksato/secrets.py src/zksato/prediction/live.py src/zksato/broker/ccxt.py src/zksato/broker/prediction.py src/zksato/prediction/broker.py src/zksato/agent_os/engine.py src/zksato/api.py tests/test_prediction.py
          ruff check src/zksato tests/test_prediction.py
          mypy src/zksato scripts
          pytest -q tests/test_prediction.py tests/test_agent_os.py tests/test_service.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair strict typing and runtime contracts'
            git push origin HEAD:agent/update-all-2026-08-31
          fi
