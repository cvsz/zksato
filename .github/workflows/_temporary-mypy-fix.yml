name: Temporary Mypy Fix

on:
  push:
    branches:
      - agent/full-repository-completion-vnext

permissions:
  contents: write

concurrency:
  group: temporary-mypy-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/full-repository-completion-vnext
          persist-credentials: true
      - name: Apply narrow typing fixes
        shell: python
        run: |
          from pathlib import Path

          auth = Path('src/zksato/auth.py')
          text = auth.read_text(encoding='utf-8')
          old = '''        try:\n            role = Role(str(payload["role"]))\n            subject = str(payload["sub"])\n            expiry = int(payload["exp"])\n            csrf = str(payload["csrf"])\n        except (KeyError, TypeError, ValueError) as exc:\n'''
          new = '''        try:\n            role = Role(str(payload["role"]))\n            subject = str(payload["sub"])\n            raw_expiry = payload["exp"]\n            if not isinstance(raw_expiry, (int, str)):\n                raise TypeError("invalid expiry type")\n            expiry = int(raw_expiry)\n            csrf = str(payload["csrf"])\n        except (KeyError, TypeError, ValueError) as exc:\n'''
          if old not in text:
              raise SystemExit('auth typing target not found')
          auth.write_text(text.replace(old, new), encoding='utf-8')

          api = Path('src/zksato/api.py')
          text = api.read_text(encoding='utf-8')
          import_anchor = 'from zksato.backtest import Backtester\n'
          if 'from zksato.broker.base import Broker\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('api import anchor not found')
              text = text.replace(import_anchor, import_anchor + 'from zksato.broker.base import Broker\n')
          branch_anchor = 'if settings.trading_mode == "paper":\n    broker = PaperBroker(store=store, initial_cash=settings.initial_cash)\n'
          replacement = 'broker: Broker\nif settings.trading_mode == "paper":\n    broker = PaperBroker(store=store, initial_cash=settings.initial_cash)\n'
          if 'broker: Broker\n' not in text:
              if branch_anchor not in text:
                  raise SystemExit('api broker anchor not found')
              text = text.replace(branch_anchor, replacement)
          api.write_text(text, encoding='utf-8')

          for name in ('src/zksato/tfex.py', 'src/zksato/broker/settrade.py', 'src/zksato/market_settrade.py'):
              path = Path(name)
              value = path.read_text(encoding='utf-8')
              value = value.replace('from settrade_v2 import Investor  # type: ignore[import-not-found]', 'from settrade_v2 import Investor')
              path.write_text(value, encoding='utf-8')
      - name: Format changed files
        run: |
          python -m pip install 'ruff==0.16.2'
          ruff format src/zksato/auth.py src/zksato/api.py src/zksato/tfex.py src/zksato/broker/settrade.py src/zksato/market_settrade.py
          ruff check --fix src/zksato/auth.py src/zksato/api.py src/zksato/tfex.py src/zksato/broker/settrade.py src/zksato/market_settrade.py
      - name: Commit fixes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No typing changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: resolve static typing findings'
          git push origin HEAD:agent/full-repository-completion-vnext
