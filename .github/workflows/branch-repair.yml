name: Branch Repair

on:
  push:
    branches:
      - agent/update-all-2026-08-31

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'style: apply canonical formatting and whitespace fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install canonical formatter
        run: python -m pip install 'ruff==0.16.5'

      - name: Apply canonical formatting
        run: ruff format .

      - name: Keep formatter deterministic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pyproject.toml')
          text = path.read_text()
          old = '"ruff>=0.11,<1.0"'
          new = '"ruff==0.16.5"'
          if old not in text:
              raise SystemExit(f'expected dependency not found: {old}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove YAML trailing whitespace
        shell: bash
        run: sed -i 's/[[:space:]]\+$//' docker-compose.yml

      - name: Verify Ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml docker-compose.yml src tests
          git commit -m 'style: apply canonical formatting and whitespace fixes'
          git push
