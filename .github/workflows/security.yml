name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-security:
    name: Python dependency and static security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and capture resolved dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip freeze --exclude-editable > audit-requirements.txt
          test -s audit-requirements.txt
      - name: Install security tools
        run: python -m pip install 'pip-audit>=2.8,<3' 'bandit>=1.8,<2'
      - name: Audit Python dependencies
        run: pip-audit --strict --progress-spinner off -r audit-requirements.txt
      - name: Bandit static analysis
        run: bandit -q -r src -ll
      - name: Scan tracked files for high-confidence secret formats
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              'private-key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'github-token': re.compile(r'gh[pousr]_[A-Za-z0-9]{20,}'),
              'aws-access-key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'openai-style-key': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          }
          excluded = {'.env.example'}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          findings = []
          for name in files:
              if not name or name in excluded:
                  continue
              path = pathlib.Path(name)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f'{name}: possible {label}')
          if findings:
              print('\n'.join(findings))
              sys.exit(1)

  codeql:
    name: CodeQL / Python
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:python
