name: Security

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  python-security:
    name: Python dependency and static security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and capture resolved dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip freeze --exclude-editable > audit-requirements.txt
          test -s audit-requirements.txt
      - name: Install security tools
        run: python -m pip install '.[security]'
      - name: Audit runtime Python dependencies
        run: pip-audit --strict --progress-spinner off -r audit-requirements.txt
      - name: Bandit static analysis
        run: bandit -q -r src -ll
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin"
      - name: Gitleaks tracked-tree scan
        run: >-
          "$RUNNER_TEMP/gitleaks-bin" dir . --redact --no-banner --config .gitleaks.toml
      - name: Scan tracked files for high-confidence secret formats
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              'private-key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'github-token': re.compile(r'gh[pousr]_[A-Za-z0-9]{20,}'),
              'aws-access-key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'openai-style-key': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
          }
          excluded = {'.env.example'}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          findings = []
          for name in files:
              if not name or name in excluded:
                  continue
              path = pathlib.Path(name)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f'{name}: possible {label}')
          if findings:
              print('\n'.join(findings))
              sys.exit(1)

  codeql:
    name: CodeQL / Python
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:python
