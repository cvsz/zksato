name: P10 Gate

on:
  push:
    branches:
      - agent/p10-durable-operations-reliability

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: p10-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[p10-gated]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zksato
          POSTGRES_PASSWORD: zksato
          POSTGRES_DB: zksato_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zksato -d zksato_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GH_TOKEN: ${{ github.token }}
      ZKSATO_TEST_DATABASE_URL: postgresql+psycopg://zksato:zksato@127.0.0.1:5432/zksato_test
      ZKSATO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      PGPASSWORD: zksato
    steps:
      - name: Validate final P10 branch and remove temporary gate
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" repo -- --branch "$GITHUB_REF_NAME" --single-branch
          cd repo
          python -m pip install --disable-pip-version-check -e '.[dev,quality,security]'
          python -m compileall -q src tests scripts
          python -m pip check
          ruff check .
          ruff format --check .
          mypy src/zksato scripts
          for migration in migrations/*.sql; do
            psql -h 127.0.0.1 -U zksato -d zksato_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          pytest -m "not uat and not performance" --cov=zksato --cov-branch --cov-report=term-missing --cov-fail-under=65
          python scripts/openapi_contract.py
          python -m build
          python -m twine check dist/*
          python -m pip_audit --progress-spinner off
          bandit -q -r src/zksato
          docker compose config >/dev/null
          docker build -t zksato:p10 .

          rm -f .github/workflows/p10-gate.yml .github/workflows/p10-format.yml .github/workflows/p10-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: finalize P10 durability validation [p10-gated]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
