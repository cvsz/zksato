name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build, audit, attest and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag matches project version
        run: |
          project_version="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$project_version" = "$tag_version" || {
            echo "Tag version $tag_version does not match pyproject version $project_version"
            exit 1
          }
      - name: Install build and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.2,<2' 'pip-audit>=2.8,<3'
          python -m pip install -e .
      - name: Audit release dependencies
        run: pip-audit --strict --skip-editable --progress-spinner off
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify built wheel installs
        run: |
          python -m venv /tmp/zksato-release-venv
          /tmp/zksato-release-venv/bin/python -m pip install --upgrade pip
          /tmp/zksato-release-venv/bin/python -m pip install dist/*.whl
          /tmp/zksato-release-venv/bin/python -c 'import zksato'
      - name: Generate dependency SBOM and checksums
        run: |
          pip-audit --strict --skip-editable --progress-spinner off \
            --format cyclonedx-json --output dist/sbom.cdx.json
          (cd dist && sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS)
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zksato-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Generate artifact attestation
        if: ${{ vars.ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "dist/*"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/sbom.cdx.json \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
