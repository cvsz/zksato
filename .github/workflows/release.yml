name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-release:
    name: Build, audit, scan, attest and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag matches project version
        run: |
          project_version="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$project_version" = "$tag_version" || {
            echo "Tag version $tag_version does not match pyproject version $project_version"
            exit 1
          }
          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"
      - name: Install application and capture resolved dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip freeze --exclude-editable > audit-requirements.txt
          test -s audit-requirements.txt
      - name: Install build and audit tooling
        run: python -m pip install 'build>=1.5,<2' 'pip-audit>=2.8,<3' 'twine>=6.2,<7'
      - name: Audit release dependencies
        run: pip-audit --strict --progress-spinner off -r audit-requirements.txt
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Verify built wheel installs and reports the release version
        run: |
          python -m venv /tmp/zksato-release-venv
          /tmp/zksato-release-venv/bin/python -m pip install --upgrade pip
          /tmp/zksato-release-venv/bin/python -m pip install dist/*.whl
          EXPECTED_VERSION="$PROJECT_VERSION" /tmp/zksato-release-venv/bin/python - <<'PY'
          import os
          import zksato
          assert zksato.__version__ == os.environ["EXPECTED_VERSION"], (
              zksato.__version__, os.environ["EXPECTED_VERSION"]
          )
          PY
      - name: Generate dependency SBOM
        run: |
          pip-audit --strict --progress-spinner off -r audit-requirements.txt \
            --format cyclonedx-json --output dist/sbom.cdx.json
      - name: Build local release candidate image
        run: docker build --pull --tag zksato:release-scan .
      - name: Fail on fixed critical release-image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zksato:release-scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate release-image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zksato:release-scan
          format: cyclonedx
          output: dist/image-sbom.cdx.json
          exit-code: "0"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish multi-architecture release container
        id: container
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record immutable container reference and checksums
        run: |
          printf '%s\n' \
            "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}@${{ steps.container.outputs.digest }}" \
            > dist/CONTAINER_IMAGE.txt
          (cd dist && sha256sum ./*.whl ./*.tar.gz ./sbom.cdx.json ./image-sbom.cdx.json ./CONTAINER_IMAGE.txt > SHA256SUMS)
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zksato-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Generate artifact attestation
        if: ${{ vars.ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "dist/*"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/sbom.cdx.json \
            dist/image-sbom.cdx.json \
            dist/CONTAINER_IMAGE.txt \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
