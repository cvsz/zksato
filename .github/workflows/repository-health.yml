name: Repository Health

on:
  push:
    branches: [main]
    paths:
      - .github/**
      - scripts/github_health.py
      - docs/GITHUB.md
  schedule:
    - cron: "11 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: repository-health
  cancel-in-progress: true

jobs:
  audit:
    name: Audit repository controls and capability gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Audit GitHub controls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_health.py --output repository-health.json
      - name: Add workflow summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          path = Path("repository-health.json")
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          lines = ["## zksato repository health", ""]
          checks = report["source_controlled_checks"]
          lines.append(f"Blocking source-controlled findings: **{len(checks['blocking'])}**")
          lines.append("")
          lines.append("| Capability | State |")
          lines.append("| --- | --- |")
          for name, probe in report["capability_probes"].items():
              state = "available" if probe["available"] else f"unavailable ({probe.get('status')})"
              lines.append(f"| `{name}` | {state} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
      - name: Upload repository health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-health-${{ github.run_id }}
          path: repository-health.json
          if-no-files-found: warn
          retention-days: 14
