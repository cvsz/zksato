name: UAT Certification

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional HTTPS URL override; defaults to uat environment variable"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: uat-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Non-mutating Settrade UAT evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: uat
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate UAT inputs
        env:
          BASE_URL: ${{ inputs.base_url || vars.ZKSATO_UAT_BASE_URL }}
          ZKSATO_UAT_API_KEY: ${{ secrets.ZKSATO_UAT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo 'Missing UAT base URL: set environment variable ZKSATO_UAT_BASE_URL or provide base_url.'; exit 1; }
          test -n "$ZKSATO_UAT_API_KEY" || { echo 'Missing UAT environment secret ZKSATO_UAT_API_KEY'; exit 1; }
          case "$BASE_URL" in
            https://*) ;;
            *) echo 'UAT base_url must use HTTPS.'; exit 1 ;;
          esac
      - name: Collect non-mutating certification evidence
        env:
          BASE_URL: ${{ inputs.base_url || vars.ZKSATO_UAT_BASE_URL }}
          ZKSATO_UAT_API_KEY: ${{ secrets.ZKSATO_UAT_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/uat_certify.py \
            --base-url "$BASE_URL" \
            --api-key "$ZKSATO_UAT_API_KEY" \
            > uat-certification.json
          python -m json.tool uat-certification.json >/dev/null
      - name: Upload certification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-certification-${{ github.run_id }}
          path: uat-certification.json
          if-no-files-found: error
          retention-days: 30
