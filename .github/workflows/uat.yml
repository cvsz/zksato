name: Settrade UAT Certification

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed zksato UAT base URL, for example https://uat.example.com"
        required: true
        type: string
      confirmation:
        description: "Type READ_ONLY_UAT to run the non-mutating certification probe"
        required: true
        type: string

concurrency:
  group: settrade-uat-certification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify:
    name: Read-only UAT certification
    if: inputs.confirmation == 'READ_ONLY_UAT'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: uat
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Validate inputs and secret
        env:
          BASE_URL: ${{ inputs.base_url }}
          API_KEY: ${{ secrets.ZKSATO_UAT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BASE_URL" in
            http://*|https://*) ;;
            *) echo "base_url must use http:// or https://" >&2; exit 2 ;;
          esac
          test -n "$API_KEY" || {
            echo "Missing environment secret ZKSATO_UAT_API_KEY" >&2
            exit 3
          }
      - name: Run non-mutating UAT probe
        env:
          BASE_URL: ${{ inputs.base_url }}
          API_KEY: ${{ secrets.ZKSATO_UAT_API_KEY }}
        run: python scripts/uat_certify.py --base-url "$BASE_URL" --api-key "$API_KEY"
