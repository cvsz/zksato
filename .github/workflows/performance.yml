name: Performance

on:
  schedule:
    - cron: "23 20 * * 6"
  workflow_dispatch:
    inputs:
      requests:
        description: "Bounded request count (1-10000)"
        required: false
        default: "1000"
        type: string
      concurrency:
        description: "Bounded concurrency (1-200)"
        required: false
        default: "25"
        type: string
      max_p95_ms:
        description: "Maximum accepted p95 latency in milliseconds"
        required: false
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: performance
  cancel-in-progress: true

jobs:
  health-load-probe:
    name: Local hardened-container load probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build image
        run: docker build --pull --tag zksato:perf .
      - name: Start hardened application
        run: >-
          docker run -d
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --cap-drop ALL
          --security-opt no-new-privileges:true
          -p 9569:9569
          --name zksato-perf
          zksato:perf
      - name: Wait for health
        run: |
          set -euo pipefail
          trap 'docker logs zksato-perf || true' ERR
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9569/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run bounded load probe with SLO threshold
        env:
          REQUESTS: ${{ inputs.requests || '1000' }}
          CONCURRENCY: ${{ inputs.concurrency || '25' }}
          MAX_P95_MS: ${{ inputs.max_p95_ms || '500' }}
        run: |
          python scripts/load_test.py \
            --url http://127.0.0.1:9569/health \
            --requests "$REQUESTS" \
            --concurrency "$CONCURRENCY" \
            --max-failures 0 \
            --max-p95-ms "$MAX_P95_MS" \
            --output performance.json
      - name: Add performance summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          path = Path("performance.json")
          if not path.exists():
              raise SystemExit(0)
          result = json.loads(path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Performance evidence\n\n")
              handle.write(f"- passed: **{result['passed']}**\n")
              handle.write(f"- requests: **{result['requests']}**\n")
              handle.write(f"- failures: **{result['failures']}**\n")
              handle.write(f"- p95: **{result['p95_ms']} ms**\n")
              handle.write(f"- p99: **{result['p99_ms']} ms**\n")
              handle.write(f"- throughput: **{result['requests_per_second']} req/s**\n")
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.run_id }}
          path: performance.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop application
        if: always()
        run: docker rm -f zksato-perf >/dev/null 2>&1 || true
