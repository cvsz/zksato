name: Production Readiness

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional production-facing HTTPS URL override; defaults to production environment variable"
        required: false
        default: ""
        type: string
      confirmation:
        description: "Type READINESS_ONLY; this workflow never submits an order"
        required: true
        type: string
      broker_permission_confirmed:
        required: true
        default: false
        type: boolean
      legal_operational_review_complete:
        required: true
        default: false
        type: boolean
      settrade_uat_complete:
        required: true
        default: false
        type: boolean
      tls_verified:
        required: true
        default: false
        type: boolean
      managed_secrets_verified:
        required: true
        default: false
        type: boolean
      backup_restore_drill_complete:
        required: true
        default: false
        type: boolean
      monitoring_alerts_verified:
        required: true
        default: false
        type: boolean
      incident_response_verified:
        required: true
        default: false
        type: boolean
      deployment_rollback_verified:
        required: true
        default: false
        type: boolean
      capacity_slo_verified:
        required: true
        default: false
        type: boolean
      time_sync_verified:
        required: true
        default: false
        type: boolean
      market_data_failover_verified:
        required: true
        default: false
        type: boolean
      data_retention_verified:
        required: true
        default: false
        type: boolean
      release_artifact_verified:
        required: true
        default: false
        type: boolean
      manual_canary_authorized:
        required: true
        default: false
        type: boolean
      uat_orders_reconciled:
        description: "Count of externally verified and reconciled UAT orders"
        required: true
        default: "0"
        type: string
      evidence_reference:
        description: "Change ticket, approval record, or evidence reference"
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate non-executing production readiness
    if: inputs.confirmation == 'READINESS_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate endpoint, evidence reference and protected secret
        env:
          BASE_URL: ${{ inputs.base_url || vars.ZKSATO_PRODUCTION_BASE_URL }}
          API_KEY: ${{ secrets.ZKSATO_PRODUCTION_RISK_API_KEY }}
          UAT_ORDERS_RECONCILED: ${{ inputs.uat_orders_reconciled }}
          EVIDENCE_REFERENCE: ${{ inputs.evidence_reference }}
        shell: python
        run: |
          import ipaddress
          import os
          from urllib.parse import urlsplit

          raw_url = os.environ.get("BASE_URL", "").strip()
          if not raw_url:
              raise SystemExit(
                  "Missing production base URL: set environment variable "
                  "ZKSATO_PRODUCTION_BASE_URL or provide base_url"
              )
          url = urlsplit(raw_url)
          if url.scheme != "https" or not url.hostname or url.username or url.password:
              raise SystemExit("Production readiness requires a credential-free https:// endpoint")
          if url.query or url.fragment:
              raise SystemExit("Production readiness base_url must not contain query or fragment data")
          try:
              address = ipaddress.ip_address(url.hostname)
          except ValueError:
              address = None
          if address and (address.is_loopback or address.is_unspecified or address.is_link_local):
              raise SystemExit("Production readiness endpoint must not be loopback/link-local")
          if not os.environ.get("API_KEY"):
              raise SystemExit("Missing production environment secret ZKSATO_PRODUCTION_RISK_API_KEY")
          reconciled = os.environ["UAT_ORDERS_RECONCILED"]
          if not reconciled.isdigit():
              raise SystemExit("uat_orders_reconciled must be a non-negative integer")
          if not os.environ.get("EVIDENCE_REFERENCE", "").strip():
              raise SystemExit("evidence_reference is required for production readiness")
      - name: Build external evidence payload
        env:
          BROKER_PERMISSION: ${{ inputs.broker_permission_confirmed }}
          LEGAL_REVIEW: ${{ inputs.legal_operational_review_complete }}
          SETTRADE_UAT: ${{ inputs.settrade_uat_complete }}
          TLS_VERIFIED: ${{ inputs.tls_verified }}
          MANAGED_SECRETS: ${{ inputs.managed_secrets_verified }}
          BACKUP_RESTORE: ${{ inputs.backup_restore_drill_complete }}
          MONITORING: ${{ inputs.monitoring_alerts_verified }}
          INCIDENT_RESPONSE: ${{ inputs.incident_response_verified }}
          DEPLOYMENT_ROLLBACK: ${{ inputs.deployment_rollback_verified }}
          CAPACITY_SLO: ${{ inputs.capacity_slo_verified }}
          TIME_SYNC: ${{ inputs.time_sync_verified }}
          MARKET_DATA_FAILOVER: ${{ inputs.market_data_failover_verified }}
          DATA_RETENTION: ${{ inputs.data_retention_verified }}
          RELEASE_ARTIFACT: ${{ inputs.release_artifact_verified }}
          CANARY_AUTHORIZED: ${{ inputs.manual_canary_authorized }}
          UAT_ORDERS_RECONCILED: ${{ inputs.uat_orders_reconciled }}
          EVIDENCE_REFERENCE: ${{ inputs.evidence_reference }}
        run: |
          python - <<'PY'
          import json
          import os

          def flag(name: str) -> bool:
              return os.environ[name].lower() == "true"

          payload = {
              "broker_permission_confirmed": flag("BROKER_PERMISSION"),
              "legal_operational_review_complete": flag("LEGAL_REVIEW"),
              "settrade_uat_complete": flag("SETTRADE_UAT"),
              "tls_verified": flag("TLS_VERIFIED"),
              "managed_secrets_verified": flag("MANAGED_SECRETS"),
              "backup_restore_drill_complete": flag("BACKUP_RESTORE"),
              "monitoring_alerts_verified": flag("MONITORING"),
              "incident_response_verified": flag("INCIDENT_RESPONSE"),
              "deployment_rollback_verified": flag("DEPLOYMENT_ROLLBACK"),
              "capacity_slo_verified": flag("CAPACITY_SLO"),
              "time_sync_verified": flag("TIME_SYNC"),
              "market_data_failover_verified": flag("MARKET_DATA_FAILOVER"),
              "data_retention_verified": flag("DATA_RETENTION"),
              "release_artifact_verified": flag("RELEASE_ARTIFACT"),
              "manual_canary_authorized": flag("CANARY_AUTHORIZED"),
              "uat_orders_reconciled": int(os.environ["UAT_ORDERS_RECONCILED"]),
              "evidence_reference": os.environ["EVIDENCE_REFERENCE"].strip(),
          }
          with open("readiness-evidence.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
          PY
      - name: Evaluate readiness and generate canary plan
        env:
          BASE_URL: ${{ inputs.base_url || vars.ZKSATO_PRODUCTION_BASE_URL }}
          API_KEY: ${{ secrets.ZKSATO_PRODUCTION_RISK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 20 \
            --request POST \
            --header "X-API-Key: ${API_KEY}" \
            --header "Content-Type: application/json" \
            --data @readiness-evidence.json \
            "${base}/v1/production/readiness" \
            --output readiness-report.json
          curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 20 \
            --request POST \
            --header "X-API-Key: ${API_KEY}" \
            --header "Content-Type: application/json" \
            --data @readiness-evidence.json \
            "${base}/v1/production/canary-plan" \
            --output canary-plan.json
          python -m json.tool readiness-report.json
          python -m json.tool canary-plan.json
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-readiness-${{ github.run_id }}
          path: |
            readiness-evidence.json
            readiness-report.json
            canary-plan.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce fail-closed readiness result
        shell: python
        run: |
          import json
          import sys

          with open("readiness-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          with open("canary-plan.json", encoding="utf-8") as handle:
              plan = json.load(handle)

          ready = report.get("ready_for_manual_canary") is True
          allowed = plan.get("allowed") is True
          non_autonomous = plan.get("autonomous_execution") is False
          maximum_orders = plan.get("maximum_orders") == 1
          if not (ready and allowed and non_autonomous and maximum_orders):
              print("Production readiness gate is not satisfied; no execution was attempted.")
              sys.exit(1)
          print("Readiness evidence passed for a separately authorized one-order manual canary only.")
