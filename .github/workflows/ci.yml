name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zksato_test
          POSTGRES_USER: zksato
          POSTGRES_PASSWORD: zksato_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zksato -d zksato_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZKSATO_TEST_DATABASE_URL: postgresql+psycopg://zksato:zksato_test@127.0.0.1:5432/zksato_test
      PGPASSWORD: zksato_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Apply PostgreSQL migrations
        run: |
          set -euo pipefail
          for migration in migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U zksato -d zksato_test -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -m "not uat and not performance" --junitxml=junit.xml
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-python-3.11
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Compatibility / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test supported interpreter
        run: pytest -m "not uat and not performance"
