name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zksato_test
          POSTGRES_USER: zksato
          POSTGRES_PASSWORD: zksato_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zksato -d zksato_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZKSATO_TEST_DATABASE_URL: postgresql+psycopg://zksato:zksato_test@127.0.0.1:5432/zksato_test
      PGPASSWORD: zksato_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Apply PostgreSQL migrations
        run: |
          for migration in migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U zksato -d zksato_test -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -m "not uat and not performance"
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
