name: Container Security

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - src/**
      - .github/workflows/container-security.yml
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - src/**
      - .github/workflows/container-security.yml
  merge_group:
  schedule:
    - cron: "37 20 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  scan:
    name: Vulnerability, SBOM and hardened-runtime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag zksato:security .
      - name: Scan all image findings for evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zksato:security
          format: json
          output: trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Fail on fixed critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zksato:security
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zksato:security
          format: cyclonedx
          output: image-sbom.cdx.json
          exit-code: "0"
      - name: Verify hardened runtime profile
        run: |
          set -euo pipefail
          user="$(docker image inspect zksato:security --format '{{.Config.User}}')"
          test "$user" = "zksato"
          cid="$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges:true -p 9569:9569 --name zksato-hardened zksato:security)"
          trap 'docker logs zksato-hardened || true; docker rm -f zksato-hardened >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9569/health > hardened-health.json; then
              cat hardened-health.json
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' "$cid" | grep -qx true; then
              exit 1
            fi
            sleep 1
          done
          exit 1
      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-${{ github.run_id }}
          path: |
            trivy-image.json
            image-sbom.cdx.json
            hardened-health.json
          if-no-files-found: warn
          retention-days: 14
