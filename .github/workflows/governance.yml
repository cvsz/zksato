name: Governance

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install governance toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[quality]'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          install -m 0755 "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/actionlint-bin"
      - name: Verify repository operating documents
        shell: bash
        run: |
          set -euo pipefail
          for f in AGENTS.md README.md ROADMAP.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md GOVERNANCE.md docs/INDEX.md docs/FEATURE-MATRIX.md docs/EXECUTION-PLAN.md docs/GITHUB.md; do
            test -s "$f" || { echo "Missing required file: $f"; exit 1; }
          done
          if grep -R --exclude-dir=.git --exclude='*.pyc' -n '127\.0\.0\.1:9999\|--port 9999\|9999:9999' README.md docs Dockerfile docker-compose.yml; then
            echo 'Deprecated port 9999 found; use 9569.'
            exit 1
          fi
      - name: Enforce immutable external Actions
        shell: python
        run: |
          import pathlib
          import re
          import sys

          bad = []
          uses_pattern = re.compile(r"^\s*uses:\s*([^\s]+)@([^\s#]+)")
          forbidden_trigger = re.compile(r"^\s*pull_request_target\s*:", re.MULTILINE)
          for path in pathlib.Path('.github/workflows').glob('*.y*ml'):
              text = path.read_text(encoding='utf-8')
              if forbidden_trigger.search(text):
                  bad.append(f'{path}: pull_request_target is forbidden by default')
              for line_no, line in enumerate(text.splitlines(), 1):
                  match = uses_pattern.match(line)
                  if not match:
                      continue
                  action, ref = match.groups()
                  if action.startswith('./'):
                      continue
                  if not re.fullmatch(r'[0-9a-f]{40}', ref):
                      bad.append(f'{path}:{line_no}: {action}@{ref} is not pinned to a full commit SHA')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
      - name: Verify workflow least-privilege declarations
        shell: python
        run: |
          import pathlib
          import re
          import sys

          bad = []
          write_all = re.compile(r"^\s*permissions\s*:\s*write-all\s*$", re.MULTILINE)
          for path in pathlib.Path('.github/workflows').glob('*.y*ml'):
              text = path.read_text(encoding='utf-8')
              if '\npermissions:' not in text:
                  bad.append(f'{path}: missing top-level permissions declaration')
              if write_all.search(text):
                  bad.append(f'{path}: write-all permission is forbidden')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
      - name: Validate YAML
        run: yamllint .github .yamllint.yml docker-compose.yml
      - name: Validate GitHub Actions syntax
        run: "$RUNNER_TEMP/actionlint-bin" -color
      - name: Audit GitHub Actions security posture
        run: zizmor --min-severity high --min-confidence high .github/workflows
      - name: Validate shell scripts
        run: shellcheck scripts/*.sh
      - name: Validate Dockerfile
        run: hadolint Dockerfile
